<!-- Подвал письма -->
<table
  role="presentation"
  border="0"
  width="100%"
  cellspacing="0"
  cellpadding="0"
  style="
    background-color: #002878;
    color: #fff;
    font-family: 'Roboto', Arial, sans-serif;
    margin: 0 auto;
  "
>
  <!-- Импорт шрифта Roboto и адаптив -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

    /* Адаптация для ≤ 480px */
    @media only screen and (max-width: 480px) {
      .footer-column {
        display: block !important;
        width: 100% !important;
        text-align: center !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
      }
      .footer-logo {
        padding-top: 8px !important;
        padding-bottom: 8px !important;
      }
      .footer-logo img {
        margin: 0 auto !important;
      }
      .footer-logo p {
        display: none !important;
      }
    }
  </style>

  <tr>
    <!-- Левая колонка (логотип + описание) -->
    <td
      class="footer-column footer-logo"
      align="left"
      valign="top"
      style="padding: 12px 16px; text-align: left"
    >
      <a
        href="https://www.heavy-engineering.ru"
        target="_blank"
        style="text-decoration: none; display: inline-block"
      >
        <img
          src="https://heavy-engineering.ru/logo.png"
          alt="Heavy Engineering"
          width="110"
          style="display: block; filter: brightness(0) invert(1)"
        />
      </a>
      <p
        style="
          font-size: 12px;
          line-height: 1.5;
          opacity: 0.9;
          margin: 6px 0 0;
          text-align: left;
        "
      >
        Официальный дилер катализаторов
      </p>
    </td>

    <!-- Правая колонка (контакты) -->
    <td
      class="footer-column footer-right"
      align="right"
      valign="top"
      style="padding: 12px 16px; text-align: right"
    >
      <p style="margin: 0; font-size: 13px">
        <a href="tel:+74951234567" style="color: #fff; text-decoration: none"
          >📞 +7 (495) 123-45-67</a
        >
      </p>
      <p style="margin: 0; font-size: 13px">
        <a
          href="mailto:info@heavy-engineering.ru"
          style="color: #fff; text-decoration: none"
          >✉️ info@heavy-engineering.ru</a
        >
      </p>
      <p style="margin: 0; font-size: 13px">
        <a
          href="https://www.heavy-engineering.ru"
          style="color: #fff; text-decoration: none"
          >🌐 heavy-engineering.ru</a
        >
      </p>
    </td>
  </tr>
</table>
